name: Episode 02 Shot 01 — Wide City Visual Preview

on:
  push:
    branches:
      - v2-local-render
    paths:
      - ".github/workflows/episode02-shot01-visual-preview.yml"
      - "studio/src/v2/episodes/in-this-town-02/EDITORIAL_SCRATCH_PLAN.json"
      - "studio/src/v2/episodes/in-this-town-02/cameraDirector.ts"
      - "studio/src/v2/episodes/in-this-town-02/Episode.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: episode02-shot01-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-shot01:
    name: Render 84 actual wide-city frames (not storyboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      V2_GL: "swangle"
      V2_RENDER_CONCURRENCY: "1"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - name: Checkout the exact shot source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24 and locked npm dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Set Chromium
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"; fi

      - name: Check FFmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript and original Episode 01 style-lock checks
        run: |
          npm run typecheck
          npm run episode2:style-check

      - name: Prepare all 60 shot boundaries without audio requests
        run: node scripts/episode02-prepare.mjs --allow-scratch

      - name: Render only the newly designed 84-frame Shot 01
        run: node scripts/episode02-render.mjs preview --shots 01 --force

      - name: Verify exact 2.8 second H264 video and make actual review frames
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=out/v2-episodes/in-this-town-02/preview-segments/01.mp4
          TARGET=out/v2-episodes/in-this-town-02/shot01-city-review
          mkdir -p "$TARGET"
          cp "$SOURCE" "$TARGET/SHOT01_City_Wide_Push_540p.mp4"
          cp "${SOURCE%.mp4}.json" "$TARGET/SHOT01_Source_Metadata.json"
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json "$SOURCE" > "$TARGET/SHOT01_FFprobe.json"
          node -e "const s=require('./out/v2-episodes/in-this-town-02/shot01-city-review/SHOT01_FFprobe.json').streams[0]; if(s.width!==540||s.height!==960||Number(s.nb_read_frames)!==84||s.r_frame_rate!=='30/1') process.exit(2)"
          for t in 0.0 0.6 1.4 2.2 2.73; do
            ffmpeg -nostdin -hide_banner -loglevel error -y -ss "$t" -i "$SOURCE" -frames:v 1 "$TARGET/SHOT01_frame_${t}.jpg"
          done

      - name: Upload playable Shot 01 and real rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Episode02_SHOT01_WideCity_MovingPreview
          path: studio/out/v2-episodes/in-this-town-02/shot01-city-review/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
