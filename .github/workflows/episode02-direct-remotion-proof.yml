name: Episode 02 direct Remotion visual proof (no FFmpeg install)

# Local rendering is primary. Cloud video runs only by explicit manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moving-shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      V2_GL: "swangle"
      V2_RENDER_CONCURRENCY: "1"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked dependencies without changing versions
        run: npm ci --no-audit --no-fund
      - name: Verify Episode 1 style, cat rig, types and physical box geometry
        run: |
          npm run typecheck
          node scripts/episode02-box-tests.mjs
          node scripts/episode02-director-preflight.mjs --strict
      - name: Generate approved timing-free silent shot props without FFmpeg or paid audio
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const source='src/v2/episodes/in-this-town-02/EDITORIAL_SCRATCH_PLAN.json';
          const plan=JSON.parse(fs.readFileSync(source,'utf8'));
          const shots=plan.shots.map(s=>({
            id:s.id,sequence:s.sequence,act:s.act,
            start:s.estimateStartFrame,end:s.estimateEndFrame,
            sourceStart:s.estimateStartFrame,sourceEnd:s.estimateEndFrame,
            cameraAndAction:s.cameraAndAction,narrationAnchor:s.narrationAnchor,soundCue:s.soundCue
          }));
          if(shots.length!==60||shots[0].start!==0||shots.some((s,i)=>s.end<=s.start||
            (i>0&&s.start!==shots[i-1].end)))throw Error('Invalid shot timing data');
          const dir='out/v2-episodes/in-this-town-02';
          fs.mkdirSync(dir,{recursive:true});
          fs.writeFileSync(dir+'/render-props.json',JSON.stringify({
            shots,captions:[],previewScale:.5,optimize:true,audioApproved:false
          },null,2));
          console.log('60 real director-mapped source shots prepared: NO voice, music or FFmpeg required');
          JS
      - name: Native Remotion render of actual story beats 04 05 06 07 49 50 51
        run: node scripts/episode02-render.mjs preview --shots 04,05,06,07,49,50,51
      - name: Upload real rendered video segments for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode02-seven-moving-shots-${{ github.run_number }}
          path: studio/out/v2-episodes/in-this-town-02/preview-segments
          if-no-files-found: warn
          retention-days: 7
