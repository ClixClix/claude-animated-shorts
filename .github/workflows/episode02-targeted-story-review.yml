name: Episode 02 targeted story-shot review (no paid requests)

on:
  workflow_dispatch:
  push:
    branches: [v2-local-render]
    paths:
      - ".github/workflows/episode02-targeted-story-review.yml"

permissions:
  contents: read

jobs:
  seven-shot-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      V2_GL: "swangle"
      V2_RENDER_CONCURRENCY: "1"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install locked modules
        run: npm ci --no-audit --no-fund
      - name: Verify exact sources and types
        run: |
          npm run typecheck
          npm run episode2:director-audit
          npm run episode2:action-audit -- --strict
      - name: Ensure FFmpeg and browser executable exist
        shell: bash
        run: |
          set -e
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"; fi
          ffmpeg -version | head -n 1
      - name: Prepare silent scratch timing, never pay for or regenerate narration
        run: node scripts/episode02-prepare.mjs --force-silent-scratch --allow-scratch
      - name: Start-middle-end genuine Remotion PNGs before any shot MP4
        run: node src/v2/episodes/in-this-town-02/tools/cloud-scratch-stills.mjs --shots 04,05,06,07,49,50,51,52
      - name: Render actual moving footage for targeted rejected shots
        run: node scripts/episode02-render.mjs preview --shots 04,05,06,07,49,50,51,52
      - name: Extract first-middle-last real frames for contact evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="out/v2-episodes/in-this-town-02/preview-segments"
          mkdir -p "$OUT/evidence"
          for SHOT in 04 05 06 07 49 50 51 52; do
            for SEC in 0.1 0.6 1.2; do
              ffmpeg -v error -y -ss "$SEC" -i "$OUT/$SHOT.mp4" -frames:v 1 "$OUT/evidence/${SHOT}_${SEC}.png" || true
            done
          done
      - name: Upload seven shot clips plus sampled frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode02-targeted-shots-${{ github.run_number }}
          path: |
            studio/out/v2-episodes/in-this-town-02/preview-segments
            studio/out/v2-episodes/in-this-town-02/cloud-three-frame-proof
            studio/out/v2-episodes/in-this-town-02/EP02_DIRECTOR_PREFLIGHT.json
            studio/out/v2-episodes/in-this-town-02/EP02_ACTION_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 7
