name: Episode 02 Shot 02 — Curled Cat Visual Preview

on:
  push:
    branches:
      - v2-local-render
    paths:
      - ".github/workflows/episode02-shot02-visual-preview.yml"
      - "studio/src/v2/episodes/in-this-town-02/EDITORIAL_SCRATCH_PLAN.json"
      - "studio/src/v2/episodes/in-this-town-02/cameraDirector.ts"
      - "studio/src/v2/episodes/in-this-town-02/Episode.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: episode02-shot02-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-shot02:
    name: Render 21 actual curled-cat frames (not storyboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      V2_GL: "swangle"
      V2_RENDER_CONCURRENCY: "1"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - name: Checkout the exact shot source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24 and locked npm dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Set Chromium
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"; fi

      - name: Inspect media tools (render does not require external FFmpeg)
        shell: bash
        run: |
          command -v ffmpeg || true
          command -v ffprobe || true

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: TypeScript and original Episode 01 style-lock checks
        run: |
          npm run typecheck
          npm run episode2:style-check

      - name: Prepare silent 60-shot manifest without external FFmpeg
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source=JSON.parse(fs.readFileSync('src/v2/episodes/in-this-town-02/EDITORIAL_SCRATCH_PLAN.json','utf8'));
          const shots=source.shots.map(s=>({
            id:s.id,sequence:s.sequence,act:s.act,
            start:s.estimateStartFrame,end:s.estimateEndFrame,
            narrationAnchor:s.narrationAnchor,
            cameraAndAction:s.cameraAndAction,soundCue:s.soundCue
          }));
          if(shots.length!==60||shots[1].start!==84||shots[1].end!==105||shots[59].end!==3876)throw Error('Shot timeline mismatch');
          const out='out/v2-episodes/in-this-town-02';
          fs.mkdirSync(out,{recursive:true});
          fs.writeFileSync(out+'/render-props.json',JSON.stringify({
            shots,captions:[],previewScale:1,optimize:true,audioApproved:false
          },null,2));
          NODE

      - name: Render only the newly designed 21-frame Shot 02
        run: node scripts/episode02-render.mjs preview --shots 02 --force

      - name: Export actual Shot 02 MP4 with source metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=out/v2-episodes/in-this-town-02/preview-segments/02.mp4
          TARGET=out/v2-episodes/in-this-town-02/shot02-box-review
          mkdir -p "$TARGET"
          test -s "$SOURCE"
          cp "$SOURCE" "$TARGET/SHOT02_Cat_Three_Quarter_Box_540p.mp4"
          cp "${SOURCE%.mp4}.json" "$TARGET/SHOT02_Source_Metadata.json"
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json "$SOURCE" > "$TARGET/SHOT02_FFprobe.json"
            for t in 0.00 0.16 0.32 0.48 0.65; do
              ffmpeg -nostdin -hide_banner -loglevel error -y -ss "$t" -i "$SOURCE" -frames:v 1 "$TARGET/SHOT02_frame_${t}.jpg"
            done
          fi

      - name: Upload playable Shot 02 and real rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Episode02_SHOT02_CurledCat_MovingPreview
          path: studio/out/v2-episodes/in-this-town-02/shot02-box-review/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
