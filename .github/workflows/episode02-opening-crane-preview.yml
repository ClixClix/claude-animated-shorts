name: Episode 02 — Seamless Shot 01 to Shot 02 Right Crane

on:
  push:
    branches: [v2-local-render]
    paths:
      - ".github/workflows/episode02-opening-crane-preview.yml"
      - "studio/scripts/episode02-opening-crane-preview.mjs"
      - "studio/src/v2/episodes/in-this-town-02/cameraDirector.ts"
      - "studio/src/v2/episodes/in-this-town-02/Episode.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep02-continuous-city-crane-${{ github.sha }}
  cancel-in-progress: false

jobs:
  continuous-opening:
    name: Render uninterrupted 105-frame city-to-kitten crane
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      V2_GL: "swangle"
      V2_RENDER_CONCURRENCY: "2"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Locate local Chromium
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"; fi
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript and original Episode 01 style
        run: |
          npm run typecheck
          npm run episode2:style-check
      - name: Create exact 60-shot silent source manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('src/v2/episodes/in-this-town-02/EDITORIAL_SCRATCH_PLAN.json','utf8'));
          const shots=s.shots.map(x=>({
            id:x.id,sequence:x.sequence,act:x.act,
            start:x.estimateStartFrame,end:x.estimateEndFrame,
            narrationAnchor:x.narrationAnchor,
            cameraAndAction:x.cameraAndAction,soundCue:x.soundCue
          }));
          if(shots.length!==60||shots[0].end!==84||shots[1].start!==84||
              shots[1].end!==105||shots[59].end!==3876)
            throw Error('Timeline is not 60 shots, 3,876 frames and 84+21 opening');
          const out='out/v2-episodes/in-this-town-02';
          fs.mkdirSync(out,{recursive:true});
          fs.writeFileSync(out+'/render-props.json',JSON.stringify({
            shots,captions:[],previewScale:.5,optimize:true,audioApproved:false
          },null,2));
          NODE
      - name: Render one contiguous MP4 over frame 83-to-84 boundary
        run: node scripts/episode02-opening-crane-preview.mjs
      - name: Confirm playable movie exists
        shell: bash
        run: |
          test -s out/v2-episodes/in-this-town-02/opening-crane-review/EP02_Shots01-02_ContinuousCrane_540p.mp4
      - name: Upload continuous MP4 and frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EP02_Shots01-02_ContinuousRightCrane_540p
          path: studio/out/v2-episodes/in-this-town-02/opening-crane-review/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
