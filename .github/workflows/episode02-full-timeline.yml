name: Episode 02 Full 60-Shot Cloud Visual Run

on:
  push:
    branches:
      - v2-local-render
    paths:
      - ".github/workflows/episode02-full-timeline.yml"
      - "studio/src/v2/episodes/in-this-town-02/**"
      - "studio/scripts/episode02-full-review.mjs"
      - "studio/scripts/episode02-render.mjs"
      - "studio/scripts/episode02-assemble.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: episode02-full-timeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-shards:
    name: Render actual shots ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      V2_GL: "swangle"
      V2_RENDER_CONCURRENCY: "1"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - name: Checkout exact episode commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Select available Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME_PATH" ]; then
            echo "CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
            "$CHROME_PATH" --version
          fi

      - name: Install FFmpeg required by scratch manifest and review
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Source, original-style, TypeScript, box and geometry gates
        run: npm run episode2:code-audit

      - name: Prepare exact silent scratch episode manifest (no paid media)
        run: node scripts/episode02-prepare.mjs --allow-scratch

      - name: Render all 15 shots in this shard (actual Remotion footage)
        shell: bash
        run: |
          set -euo pipefail
          START=$((15 * ${{ matrix.shard }} + 1))
          END=$((START + 14))
          SHOTS="$(seq -f '%02g' "$START" "$END" | paste -sd, -)"
          echo "Rendering planned shots: $SHOTS"
          node scripts/episode02-render.mjs preview --shots "$SHOTS"
          COUNT="$(find out/v2-episodes/in-this-town-02/preview-segments -maxdepth 1 -name '*.mp4' | wc -l)"
          test "$COUNT" -eq 15

      - name: Save actual shot movies and SHA metadata
        uses: actions/upload-artifact@v4
        with:
          name: episode02-shard-${{ matrix.shard }}
          path: studio/out/v2-episodes/in-this-town-02/preview-segments/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  assemble-and-review:
    name: Assemble and verify complete 2m09s episode
    needs: render-shards
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: studio
    env:
      CI: "true"
      REMOTION_SKIP_NEW_VERSION_NOTIFICATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install FFmpeg required by assembly and full-movie decode
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild deterministic scratch manifest for assembly
        run: node scripts/episode02-prepare.mjs --allow-scratch

      - name: Retrieve ALL four cloud-rendered shards
        uses: actions/download-artifact@v4
        with:
          pattern: episode02-shard-*
          merge-multiple: true
          path: studio/out/v2-episodes/in-this-town-02/preview-segments/

      - name: Confirm 60 movie segments and 60 matching metadata files
        shell: bash
        run: |
          set -euo pipefail
          cd out/v2-episodes/in-this-town-02/preview-segments
          test "$(find . -maxdepth 1 -name '*.mp4' | wc -l)" -eq 60
          test "$(find . -maxdepth 1 -name '*.json' | wc -l)" -eq 60

      - name: Stitch real 60-shot footage (reject stale source hashes)
        run: node scripts/episode02-assemble.mjs preview

      - name: Decode entire movie, verify 3876 frames, sample ALL shots
        run: node scripts/episode02-full-review.mjs

      - name: Upload 2m09s MP4, 180 actual frames and 60-shot review board
        uses: actions/upload-artifact@v4
        with:
          name: episode02-FULL-60-SHOT-visual-review
          path: |
            studio/out/v2-episodes/in-this-town-02/EP02_540p_Visual.mp4
            studio/out/v2-episodes/in-this-town-02/VISUAL_ASSEMBLY.json
            studio/out/v2-episodes/in-this-town-02/EP02_SHOT_MANIFEST.json
            studio/out/v2-episodes/in-this-town-02/PRODUCTION_READINESS.json
            studio/out/v2-episodes/in-this-town-02/full-timeline-review/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
